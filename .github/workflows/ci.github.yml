name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  install:
    if: contains(github.server_url, 'github.com')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
